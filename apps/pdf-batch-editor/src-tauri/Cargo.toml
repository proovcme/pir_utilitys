[package]
name = "stamp-studio"
version = "0.0.1"
description = "Полуавтоматическая обработка полей и текстов проектной документации"
authors = ["Codex"]
edition = "2021"

[lib]
name = "stamp_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
